resources:
  pipelines:
    silver_validate_and_normalize:
      name: silver_validate_and_normalize
      catalog: ${var.catalog}
      schema: silver
      edition: ADVANCED
      channel: CURRENT
      photon: false
      serverless: false
      continuous: false

      # Lakeflow records every run here: flow progress, row counts, expectation
      # results. operations.pipeline_runs is built from it.
      event_log:
        catalog: ${var.catalog}
        schema: operations
        name: silver_validate_and_normalize_event_log

      configuration:
        catalog: ${var.catalog}
        bundle.sourcePath: ${workspace.file_path}
        event_log_name: silver_validate_and_normalize_event_log
        # Development runs otherwise keep the cluster alive for 2 hours.
        pipelines.clusterShutdown.delay: 60s

      clusters:
        - label: default
          node_type_id: ${var.node_type}
          num_workers: 0
          spark_conf:
            spark.master: "local[*, 4]"
            spark.databricks.cluster.profile: singleNode
          custom_tags:
            ResourceClass: SingleNode
            project: iot-telemetry-lakehouse
            layer: silver
            managed_by: databricks-bundle

      libraries:
        - file:
            path: ../pipelines/silver/reference.py
        - file:
            path: ../pipelines/silver/master_data.py
        - file:
            path: ../pipelines/silver/telemetry.py
        - file:
            path: ../pipelines/silver/operations.py