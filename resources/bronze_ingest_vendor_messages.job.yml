resources:
  jobs:
    bronze_ingest_vendor_messages:
      name: bronze_ingest_vendor_messages
      description: Appends every Event Hubs message, unparsed, to bronze.raw_telemetry_messages.
      max_concurrent_runs: 1
      tags:
        project: iot-telemetry-lakehouse
        layer: bronze
        managed_by: databricks-bundle

      tasks:
        - task_key: ingest_vendor_messages
          job_cluster_key: single_node
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest_vendor_messages.py
            base_parameters:
              catalog: ${var.catalog}
              secret_scope: ${var.secret_scope}
              secret_key: ${var.eventhub_secret_key}
              max_offsets_per_trigger: "10000"

      job_clusters:
        - job_cluster_key: single_node
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type}
            num_workers: 0
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode