resources:
  jobs:
    lakehouse_refresh:
      name: lakehouse_refresh
      description: Runs the whole chain in order, each step only after the one before succeeds - bronze ingest, silver validation, silver events, gold.
      # Strictly one step at a time: every step starts its own 4-vCPU cluster, and the
      # subscription's quota allows one.
      max_concurrent_runs: 1
      tags:
        project: iot-telemetry-lakehouse
        managed_by: databricks-bundle

      tasks:
        - task_key: bronze_registry_snapshots
          run_job_task:
            job_id: ${resources.jobs.bronze_ingest_registry_snapshots.id}

        - task_key: bronze_vendor_messages
          depends_on:
            - task_key: bronze_registry_snapshots
          run_job_task:
            job_id: ${resources.jobs.bronze_ingest_vendor_messages.id}

        - task_key: silver_validate_and_normalize
          depends_on:
            - task_key: bronze_vendor_messages
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_validate_and_normalize.id}

        - task_key: silver_derive_events
          depends_on:
            - task_key: silver_validate_and_normalize
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_derive_events.id}

        - task_key: gold_build
          depends_on:
            - task_key: silver_derive_events
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_build.id}
