bundle:
  name: iot-telemetry-lakehouse

include:
  - resources/*.yml

sync:
  exclude:
    - infra/**
    - docs/**

variables:
  catalog:
    description: Unity Catalog catalog for this environment.
  secret_scope:
    description: Databricks secret scope holding Event Hubs connection strings.
    default: iot
  eventhub_secret_key:
    description: Secret holding the listen-only Event Hubs connection string for this environment.
  spark_version:
    description: Databricks runtime for job clusters. List options with `databricks clusters spark-versions`.
    default: 17.3.x-scala2.13
  node_type:
    description: Job cluster VM size. Must fit the subscription's 4-vCPU family quota.
    default: Standard_D4ds_v4
  warehouse_id:
    description: SQL warehouse that runs the dashboards' queries, looked up by name.
    lookup:
      warehouse: Serverless Starter Warehouse
  deployer_principal:
    description: Application ID of the service principal CI/CD deploys prod with, looked up by name.
    lookup:
      service_principal: iot-lakehouse-cicd

targets:
  dev:
    mode: development
    default: true
    presets:
      tags:
        environment: dev
    variables:
      catalog: iot_dev
      eventhub_secret_key: eventhub-listen-conn-dev
    # Bootstraps an environment's catalog and gold security. Dev only: it runs as the
    # admin who starts it, because creating catalogs and granting access needs an admin.
    #   databricks bundle run setup_environment --params catalog=iot_prod
    resources:
      jobs:
        setup_environment:
          name: setup_environment
          description: Creates a catalog with its schemas and volumes, grants the deploying service principal access, and sets up gold security.
          max_concurrent_runs: 1
          parameters:
            - name: catalog
              default: ""
            - name: storage_account
              default: ""
            - name: deployer_principal
              default: ${var.deployer_principal}
          tasks:
            - task_key: setup_catalog
              notebook_task:
                notebook_path: ./notebooks/00_setup_catalog.py
            - task_key: setup_gold_security
              depends_on:
                - task_key: setup_catalog
              notebook_task:
                notebook_path: ./notebooks/03_setup_gold_security.py
            - task_key: grant_pipeline_access
              depends_on:
                - task_key: setup_gold_security
              notebook_task:
                notebook_path: ./notebooks/03_setup_gold_security.py
                base_parameters:
                  admin_principal: "{{job.parameters.deployer_principal}}"

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    # Prod changes only through git and CI/CD, which deploys as a service principal
    # that then owns every resource. People can see prod, not change it.
    permissions:
      - group_name: users
        level: CAN_VIEW
    presets:
      tags:
        environment: prod
    variables:
      catalog: iot_prod
      eventhub_secret_key: eventhub-listen-conn-prod
