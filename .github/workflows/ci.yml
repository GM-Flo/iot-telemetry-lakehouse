name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Same version as local development; bump both together.
  DATABRICKS_CLI_VERSION: "1.24.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            src/producer/requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt

      - name: Generated dashboards match their source
        run: |
          python -m src.iot.dashboards
          git diff --exit-code -- dashboards/

      - name: Fast tests (branches and pull requests)
        if: github.ref != 'refs/heads/main'
        run: pytest -m "not slow"

      - name: Full test suite (main)
        if: github.ref == 'refs/heads/main'
        run: pytest

  validate:
    # Skipped until the repository variable DATABRICKS_HOST is set.
    if: vars.DATABRICKS_HOST != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Databricks CLI
        # Downloaded through the GitHub API with the workflow's token: anonymous
        # release downloads are rate limited and time out first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.zip"
          for attempt in 1 2 3 4 5; do
            gh release download "v${DATABRICKS_CLI_VERSION}" --repo databricks/cli \
              --pattern "$asset" --dir "$RUNNER_TEMP" --clobber && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 15))
          done
          unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/databricks-cli"
          echo "$RUNNER_TEMP/databricks-cli" >> "$GITHUB_PATH"
      - run: databricks --version
      - run: databricks bundle validate --target dev
      - run: databricks bundle validate --target prod

  deploy-prod:
    # Prod deploys only when started by hand: Actions > CI/CD > Run workflow on main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [lint, test, validate]
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Databricks CLI
        # Downloaded through the GitHub API with the workflow's token: anonymous
        # release downloads are rate limited and time out first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="databricks_cli_${DATABRICKS_CLI_VERSION}_linux_amd64.zip"
          for attempt in 1 2 3 4 5; do
            gh release download "v${DATABRICKS_CLI_VERSION}" --repo databricks/cli \
              --pattern "$asset" --dir "$RUNNER_TEMP" --clobber && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 15))
          done
          unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/databricks-cli"
          echo "$RUNNER_TEMP/databricks-cli" >> "$GITHUB_PATH"
      - run: databricks --version
      - run: databricks bundle deploy --target prod
